name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      # Accessibility budget against the unauthenticated marketing/login
      # bundle (categories:accessibility is an error-level assertion in
      # lighthouserc.json). continue-on-error for now: verified locally
      # that the config/assertions are correct, but couldn't get a clean
      # pass/fail signal out of chrome-launcher on this Windows dev
      # machine to be sure of the real score on a first run here in CI -
      # remove continue-on-error once one real run has been observed.
      - run: npx lhci autorun
        continue-on-error: true
