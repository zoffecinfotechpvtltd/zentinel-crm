name: Keep backend awake

# Render's free tier sleeps a web service after 15 minutes with no traffic.
# Pinging it well inside that window keeps the Node process running
# continuously, which means its own node-cron jobs (daily digest,
# invoice-overdue check, follow-up reminders, cleanup) keep firing on
# schedule too — this isn't a workaround, it's the actual fix, since a
# sleeping process doesn't tick at all until something wakes it.
#
# Set BACKEND_URL once, after deploying: repo Settings → Secrets and
# variables → Actions → Variables → new repository variable named
# BACKEND_URL, value e.g. https://zoffec-sentinel.onrender.com
# (no trailing slash). Nothing to do here if you're not on Render's free
# tier — a paid/always-on host doesn't need this, the workflow just
# becomes a harmless no-op ping.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repo variable not set yet — skipping (see comment in this file)."
            exit 0
          fi
          curl -fsS "${{ vars.BACKEND_URL }}/api/health" || echo "Ping failed — backend may be cold-starting, that's expected occasionally."
