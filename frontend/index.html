<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zentinel</title>
    <style>
      /* Paints the correct-theme background before the JS bundle (and the
         localStorage-driven theme class it applies) has a chance to load,
         so a hard reload doesn't flash the *other* theme's background for
         a frame. Matches the OS preference only - a saved in-app override
         is applied a moment later by Layout, same as it always was. */
      html { background: #f1f5f9; }
      @media (prefers-color-scheme: dark) { html { background: #0b1020; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
