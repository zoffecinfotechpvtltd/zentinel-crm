<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Zoffec Sentinel — Setup</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0d13; color: #eef0f5; font-family: "Segoe UI", -apple-system, sans-serif;
  }
  .shell { width: 460px; padding: 32px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.sub { color: #9aa3ba; font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
  .option {
    display: block; width: 100%; text-align: left; background: #10141f; border: 1px solid #232a3d;
    border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; color: #eef0f5; cursor: pointer; font-family: inherit;
  }
  .option:hover { border-color: #333e5c; background: #171d2c; }
  .option b { display: block; font-size: 14px; margin-bottom: 4px; }
  .option span { font-size: 12px; color: #9aa3ba; line-height: 1.5; }
  .client-form { display: none; margin-top: 8px; }
  .client-form.open { display: block; }
  input {
    width: 100%; background: #171d2c; border: 1px solid #232a3d; border-radius: 8px; padding: 10px 12px;
    color: #eef0f5; font-size: 13px; margin-bottom: 10px; font-family: inherit;
  }
  button.go {
    background: #c3202f; color: #fff; border: none; border-radius: 8px; padding: 9px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .err { color: #f87171; font-size: 12px; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
  <div class="shell">
    <h1>Zoffec Sentinel</h1>
    <p class="sub">First time on this PC — is this the machine that will host the shared data, or are you connecting to a server someone else already set up?</p>

    <button class="option" id="serverBtn">
      <b>Run as Server</b>
      <span>This PC hosts the database. Everyone else on the office network connects to it. Pick this on one machine only.</span>
    </button>
    <button class="option" id="clientBtn">
      <b>Connect to a Server</b>
      <span>Someone else's PC already hosts the data. You just need its address.</span>
    </button>

    <div class="client-form" id="clientForm">
      <input id="serverUrl" placeholder="http://192.168.1.23:4317" />
      <button class="go" id="connectBtn">Connect</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <script>
    const { chooseServer, chooseClient } = window.zoffecSetup;
    document.getElementById("serverBtn").onclick = () => chooseServer();
    document.getElementById("clientBtn").onclick = () => {
      document.getElementById("clientForm").classList.add("open");
    };
    document.getElementById("connectBtn").onclick = () => {
      const url = document.getElementById("serverUrl").value.trim();
      if (!/^https?:\/\/.+/.test(url)) {
        document.getElementById("err").textContent = "Enter a full address, e.g. http://192.168.1.23:4317";
        return;
      }
      chooseClient(url);
    };
  </script>
</body>
</html>
