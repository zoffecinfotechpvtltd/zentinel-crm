# Generated for Zoffec CMS backend. Run `fly launch --copy-config --no-deploy`
# once to create the app in your Fly account, then `fly deploy`.
app = "zoffec-cms-backend"
primary_region = "bom"

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
